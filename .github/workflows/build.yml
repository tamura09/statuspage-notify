name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: "222165754930"
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::222165754930:role/github-actions-lambda-artifacts"
  ARTIFACT_NAME: statuspage-notify
  # One artifact, one Lambda function per status page being watched. Terraform
  # in tamura09/aws-terraform creates the functions and points them all at the
  # single S3 object below; each is told which page to poll through its own
  # environment. Adding a page here without adding it there fails the deploy on
  # ResourceNotFoundException, which is the intended order: Terraform first.
  FUNCTION_NAMES: claude-status-notify

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  deploy:
    name: Deploy
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build bootstrap binary
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -tags lambda.norpc -ldflags="-s -w" -o bootstrap .

      - name: Package artifact
        run: |
          touch -t 202001010000.00 bootstrap
          zip -X -q "${ARTIFACT_NAME}.zip" bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Upload artifact to S3
        run: |
          aws s3 cp "${ARTIFACT_NAME}.zip" \
            "s3://aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1/lambda/${ARTIFACT_NAME}.zip"

      - name: Deploy Lambda function code
        run: |
          for function in ${FUNCTION_NAMES}; do
            echo "::group::${function}"
            aws lambda update-function-code \
              --function-name "${function}" \
              --s3-bucket "aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1" \
              --s3-key "lambda/${ARTIFACT_NAME}.zip" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "${function}"
            echo "::endgroup::"
          done
